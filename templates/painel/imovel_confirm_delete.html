{% extends "base.html" %}

{% block content %}
<section class="container" style="max-width: 480px;">
  <h2>Excluir imóvel</h2>
  <p>Tem certeza que deseja excluir <strong>{{ imovel.titulo }}</strong>? Essa ação não pode ser desfeita.</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Sim, excluir</button>
    <a class="btn btn-outline" href="{% url 'painel:imovel_list' %}">Cancelar</a>
  </form>
</section>
{% endblock %}
