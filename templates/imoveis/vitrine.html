{% extends "base.html" %}
{% load static %}

{% block content %}
<section class="container">
  <span class="kicker reveal">Vitrine completa</span>
  <h2 class="reveal">Imóveis disponíveis</h2>

  <form method="get" class="filtros" id="form-filtros" data-url="{% url 'imoveis:vitrine' %}">
    <div>
      <label>Buscar</label>
      <input type="text" name="q" value="{{ filtros.q|default:'' }}" placeholder="Título do imóvel">
    </div>
    <div>
      <label>Negócio</label>
      <select name="tipo_negocio">
        <option value="">Todos</option>
        {% for valor, rotulo in tipos_negocio %}
          <option value="{{ valor }}" {% if filtros.tipo_negocio == valor %}selected{% endif %}>{{ rotulo }}</option>
        {% endfor %}
      </select>
    </div>
    <div>
      <label>Tipo</label>
      <select name="tipo_imovel">
        <option value="">Todos</option>
        {% for valor, rotulo in tipos_imovel %}
          <option value="{{ valor }}" {% if filtros.tipo_imovel == valor %}selected{% endif %}>{{ rotulo }}</option>
        {% endfor %}
      </select>
    </div>
    <div>
      <label>Cidade</label>
      <input type="text" name="cidade" value="{{ filtros.cidade|default:'' }}">
    </div>
    <div>
      <label>Bairro</label>
      <input type="text" name="bairro" value="{{ filtros.bairro|default:'' }}">
    </div>
    <div>
      <label>Quartos (mín.)</label>
      <input type="number" name="quartos_min" value="{{ filtros.quartos_min|default:'' }}">
    </div>
    <div>
      <label>Valor mín.</label>
      <input type="number" name="valor_min" value="{{ filtros.valor_min|default:'' }}">
    </div>
    <div>
      <label>Valor máx.</label>
      <input type="number" name="valor_max" value="{{ filtros.valor_max|default:'' }}">
    </div>
    <div class="filtros-acoes">
      <button type="submit" class="btn btn-primary">Filtrar</button>
    </div>
  </form>
  <p class="resultados-status" id="resultados-status" aria-live="polite"></p>

  <div id="resultados-imoveis">
    <div class="grid" id="resultados-grid">
      {% include "imoveis/_grid.html" %}
    </div>
  </div>
</section>
{% endblock %}

{% block extra_js %}
<script src="{% static 'js/vitrine.js' %}" defer></script>
{% endblock %}
