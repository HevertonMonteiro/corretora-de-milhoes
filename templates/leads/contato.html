{% extends "base.html" %}

{% block content %}
<section class="container" style="max-width: 560px;">
  <a href="{% url 'home' %}" class="voltar-link">← Voltar para o início</a>
  <h2>Fale com a corretora</h2>
  <p>Preencha os dados abaixo e você será redirecionado direto para o WhatsApp com a mensagem pronta.</p>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-whatsapp">Continuar no WhatsApp</button>
  </form>
</section>
{% endblock %}
